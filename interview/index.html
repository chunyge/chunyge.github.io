<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역사 인물 가상 인터뷰 · 춘쌤의 한국사</title>
<style>
  :root{--ink:#2b2b3a;--paper:#f2f6fd;--line:#d6e2f5;--c:#1565c0}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--paper)}
  header{background:linear-gradient(135deg,#0d3c84,#1565c0);color:#fff;text-align:center;padding:46px 16px 22px;position:relative}
  header small{letter-spacing:.12em;opacity:.85;font-weight:700}
  header h1{margin:4px 0 6px;font-size:clamp(1.7rem,6vw,2.4rem)}
  header p{margin:0;opacity:.9}
  .back{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.18);color:#fff;border-radius:20px;padding:6px 12px;text-decoration:none;font-weight:800;font-size:.85rem}
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 50px}
  .tabs{display:flex;gap:8px;justify-content:center;margin:4px 0 14px}
  .tabs button,.btn,.chip{font-family:inherit;font-weight:800;cursor:pointer}
  .tabs button{font-size:1rem;border:3px solid var(--ink);background:#fff;border-radius:30px;padding:9px 18px}
  .tabs button.on{background:var(--ink);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .card{background:#fff;border:3px solid var(--k);border-radius:18px;padding:14px;cursor:pointer;text-align:left;font-family:inherit;color:inherit;transition:transform .15s}
  .card:hover{transform:translateY(-3px)}
  .card .em{font-size:2rem}
  .card .no{display:inline-block;background:var(--k);color:#fff;border-radius:8px;padding:2px 8px;font-size:.8rem;font-weight:800;margin-left:6px;vertical-align:middle}
  .card b{display:block;font-size:1.15rem;margin:6px 0 2px}
  .card span.l{font-size:.83rem;color:#777}
  .done{float:right;font-size:.78rem;color:#2e7d32;font-weight:800}
  .panel{background:#fff;border:3px solid var(--c);border-radius:20px;padding:18px;margin:12px 0}
  .head{display:flex;gap:12px;align-items:center}
  .ava{flex:none;width:62px;height:62px;border-radius:50%;border:3px solid var(--c);display:flex;align-items:center;justify-content:center;font-size:2.1rem;background:#fff}
  .head b{font-size:1.25rem}.head span{display:block;color:#777;font-size:.88rem}
  .chat{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .msg{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.65;font-size:.97rem;white-space:pre-wrap}
  .them{align-self:flex-start;background:#fff;border:2px solid var(--line);border-top-left-radius:4px}
  .me{align-self:flex-end;background:var(--c);color:#fff;border-top-right-radius:4px}
  .who{font-size:.78rem;font-weight:800;opacity:.7;display:block;margin-bottom:2px}
  .hint{align-self:flex-start;background:#fff8e1;border-radius:12px;padding:8px 12px;font-size:.88rem;max-width:88%}
  .composer{position:sticky;bottom:0;background:var(--paper);padding:10px 0 4px;margin-top:10px}
  .lbl{font-weight:800;font-size:.92rem;margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{border:2px solid var(--c);color:var(--c);background:#fff;border-radius:20px;padding:6px 12px;font-size:.88rem}
  .chip:hover{background:var(--c);color:#fff}
  textarea,input{width:100%;font-family:inherit;font-size:1rem;border:2px solid var(--line);border-radius:12px;padding:10px;resize:vertical;background:#fff}
  textarea:focus,input:focus{outline:none;border-color:var(--c)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-size:1rem;color:#fff;background:var(--c)}
  .btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c)}
  .round{display:inline-block;background:var(--c);color:#fff;border-radius:20px;padding:3px 10px;font-size:.8rem;font-weight:800}
  label{display:block;font-weight:800;margin:14px 0 4px}
  label small{font-weight:600;color:#888}
  .fixed{background:#e8f0fc;border-radius:10px;padding:8px 10px;font-weight:700;font-size:.95rem}
  details{margin-top:4px;font-size:.88rem;color:#555}
  details p{background:#f7f9fd;border-radius:8px;padding:8px;margin:4px 0;line-height:1.6}
  #card{background:#fff;border:4px solid var(--c);border-radius:20px;padding:20px;max-width:640px;margin:12px auto 0}
  #card h3{margin:0 0 4px;font-size:1.3rem;line-height:1.4}
  #card .meta{color:#777;font-size:.85rem;margin-bottom:10px}
  #card dt{font-weight:900;margin-top:10px;color:var(--c)}
  #card dd{margin:2px 0 0;line-height:1.6;white-space:pre-wrap}
  .note{font-size:.85rem;color:#888;text-align:center;margin-top:8px}
  @media (max-width:560px){.msg{max-width:95%}}
</style>
</head>
<body>
<header>
  <a class="back" href="../">← 자료실</a>
  <small>QUEST 2 · 챗봇과 함께 역사 속으로</small>
  <h1>🎤 역사 인물 가상 인터뷰</h1>
  <p>나는 오늘 역사 신문 기자! 인물에게 묻고, 내 말로 기사를 써요.</p>
</header>
<main class="wrap" id="app"></main>

<script src="people.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const app = document.getElementById("app");
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem("interview:"+k) || "null"); } catch { return null; } },
  set(k,v){ try { localStorage.setItem("interview:"+k, JSON.stringify(v)); } catch {} }
};
function toast(msg){
  const d = document.createElement("div");
  d.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2b2b3a;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;max-width:90%;text-align:center";
  d.textContent = msg; document.body.appendChild(d); setTimeout(()=>d.remove(), 2800);
}

let book = 1, P = null, log = [], asked = []; // asked: [{q, type, own, a}]
const IDEA = { who:"어떤 사람이었는지 (어린 시절, 하던 일)", what:"가장 중요하게 한 일과 그 결과", why:"왜 그런 선택을 했는지", hard:"가장 힘들었던 순간이나 아쉬운 점", today:"오늘의 우리에게 하고 싶은 말" };
const CHIP = { who:"어떤 사람이었나요?", what:"가장 중요하게 한 일은 무엇인가요?", why:"왜 그런 선택을 했나요?", hard:"가장 힘들었던 순간은 언제였나요?", today:"오늘의 우리에게 하고 싶은 말은?" };
const TYPE_WORDS = {
  why:["왜","이유","까닭","무엇 때문","어째서","목적"],
  hard:["힘들","어려","두려","무서","슬펐","고통","위기","실패","후회","아쉬"],
  today:["오늘","지금","우리","현재","미래","하고 싶은 말","조언","교훈","남기"],
  what:["무엇을","무슨 일","한 일","업적","했나","했어","어떻게","활동","전투","결과","성과"],
  who:["어떤 사람","누구","어린","태어","자기소개","소개","성격","집안","직업"]
};

/* ① 인물 고르기 */
function home(){
  P = null; document.documentElement.style.setProperty("--c","#1565c0"); window.scrollTo(0,0);
  const list = PEOPLE.filter(p => p.book === book);
  app.innerHTML = `
    <div class="tabs">
      <button class="${book===1?"on":""}" onclick="book=1;home()">한국사 1</button>
      <button class="${book===2?"on":""}" onclick="book=2;home()">한국사 2</button>
    </div>
    <p style="text-align:center;margin:0 0 14px;color:#666">오늘 배운 강좌의 인물을 골라 인터뷰를 시작하세요.</p>
    <div class="grid">${list.map(p => `
      <button class="card" style="--k:${p.c}" onclick="open_('${p.id}')">
        ${store.get(p.id+":done") ? `<span class="done">✔ ${esc(store.get(p.id+":done"))}</span>` : ""}
        <span class="em">${p.emoji}</span><span class="no">${p.no}</span>
        <b>${esc(p.name)}</b><span class="l">${esc(p.years)} · ${esc(p.lecture)}</span>
      </button>`).join("")}</div>`;
}

/* ② 인터뷰 (질문 3번) */
function open_(id){
  P = PEOPLE.find(p => p.id === id); log = [{ who:"them", text:P.hello }]; asked = [];
  document.documentElement.style.setProperty("--c", P.c);
  log.push({ who:"hint", text:"기자인 내가 직접 질문을 써서 물어봐요. 인물 이름이나 사건(키워드)을 넣어 '왜?', '어떻게?'로 물을수록 좋은 기사가 나와요." });
  talk();
}
function talk(){
  window.scrollTo(0, document.body.scrollHeight);
  const n = asked.length, used = asked.map(a => a.type);
  const chips = Object.keys(CHIP).filter(t => !used.includes(t));
  app.innerHTML = `
    <div class="panel">
      <div class="head"><div class="ava">${P.emoji}</div><div><b>${esc(P.name)}</b><span>${esc(P.years)} · ${esc(P.no)} ${esc(P.lecture)}</span></div></div>
      <div class="chat">${log.map(m => m.who === "them"
        ? `<div class="msg them"><span class="who">${P.emoji} ${esc(P.name)}</span>${esc(m.text)}</div>`
        : m.who === "hint" ? `<div class="hint">💡 ${esc(m.text)}</div>`
        : `<div class="msg me"><span class="who">🎤 기자(나)</span>${esc(m.text)}</div>`).join("")}</div>
      ${n < 3 ? `
      <div class="composer">
        <div class="lbl"><span class="round">${n+1}차 질문</span> 무엇을 물어볼까요? (${n+1}/3)</div>
        <textarea id="q" rows="2" placeholder="질문을 직접 써 보세요 — 예: 왜 그때 ○○○을 했나요?"></textarea>
        <details style="margin-top:6px"><summary>💡 무엇을 물어볼지 막막하다면?</summary><p>${chips.map(t => "· " + esc(IDEA[t])).join("<br>")}<br><b>그대로 베끼지 말고, 인물·사건 이름을 넣어 내 질문으로 바꿔 쓰세요!</b></p></details>
        <div class="row"><button class="btn" onclick="ask(document.getElementById('q').value, true)">질문하기 🎤</button><button class="btn ghost" onclick="home()">다른 인물</button></div>
      </div>` : `
      <div class="row"><button class="btn" onclick="sheet()">📰 기사 쓰기 (학습지 Quest 2) →</button></div>`}
    </div>`;
  const ch = document.querySelector(".chat"); ch && ch.lastElementChild && ch.lastElementChild.scrollIntoView({block:"end"});
  const qi = document.getElementById("q");
  if (qi) qi.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(qi.value, true); } });
}
function classify(q){
  const used = asked.map(a => a.type); let best = null, bestN = 0;
  for (const [t, ws] of Object.entries(TYPE_WORDS)) {
    const n = ws.reduce((s,w)=>s+(q.includes(w)?1:0),0);
    if (n > bestN) { best = t; bestN = n; }
  }
  // 이름·키워드만 물어본 경우: 아직 안 나온 '한 일' 답으로
  if (!best && P.keywords.some(k => q.replace(/\s/g,"").includes(k.replace(/\s/g,"")))) best = "what";
  if (best && used.includes(best)) {
    const rest = ["why","what","hard","today","who"].filter(t => !used.includes(t) && TYPE_WORDS[t].some(w=>q.includes(w)));
    best = rest[0] || best;
  }
  return best;
}
/* 질문에 나온 키워드가 들어 있는 문장을 인물의 이야기에서 찾아 답해요 */
/* 질문 속 '이름·사건' 낱말 뽑기 (조사·동사 꼴은 빼요) */
function nounsIn(q){
  const STOP = ["선생님","무엇","어떻게","어땠","그때","당시","정말","생각","궁금","나라","사람","시대","마음","가장","제일","당신","여기","거기","이것","그것"];
  return q.replace(/[?!.,~'"]/g," ").split(/\s+/)
    .map(w => w.replace(/(은|는|이|가|을|를|에서|에게|에|의|도|와|과|으로|로|까지|이란|란|께서|님|이라|라)$/,""))
    .filter(w => w.length >= 2 && !/[하했었았니요까고서며던게지나다죠네]$/.test(w) && !STOP.some(x => w.includes(x)));
}
/* 인물의 이야기에서 그 낱말이 들어 있는 문장을 찾아요 */
function sentencesAbout(words){
  if (!words.length) return null;
  const usedA = asked.map(x => x.a).join(" ");
  const scored = [];
  for (const ans of Object.values(P.qa)) {
    (ans.match(/[^.?!]+[.?!]?/g) || []).map(x => x.trim()).filter(Boolean).forEach(sn => {
      const n = words.filter(w => sn.includes(w)).length;
      if (n && !usedA.includes(sn)) scored.push([n, sn]);
    });
  }
  if (!scored.length) return null;
  scored.sort((x,y) => y[0]-x[0]);
  const top = scored[0][0];
  return scored.filter(x => x[0] >= top).slice(0, 3).map(x => x[1]).join(" ");
}
function ask(q, own){
  q = String(q || "").trim();
  if (q.length < 6) { toast("질문을 문장으로 조금 더 자세히 써 주세요!"); return; }
  if (asked.some(a => a.q === q)) { toast("같은 질문은 이미 했어요. 다른 질문을 해 보세요!"); return; }
  log.push({ who:"me", text:q });
  const words = nounsIn(q);
  const t = classify(q);
  const used = asked.map(a => a.type);
  let type = null, a = null;
  // ① 질문 유형(왜·힘든 점 등)의 답에 질문 속 낱말이 들어 있거나 낱말이 없으면 → 그 유형의 답
  if (t && !used.includes(t) && (!words.length || words.some(w => P.qa[t].includes(w)))) { type = t; a = P.qa[t]; }
  // ② 아니면 질문 속 이름·사건이 나오는 문장으로 답
  if (!a) { const about = sentencesAbout(words); if (about) { type = "kw"; a = about; } }
  // ③ 그래도 없으면 유형 답(이미 했던 유형이면 다시 말해 줌)
  if (!a && t) { type = t; a = (used.includes(t) ? "앞에서도 말했지만, " : "") + P.qa[t]; }
  if (!a) {
    log.push({ who:"them", text:"음… 그 질문은 내가 답하기 어렵구려. 내가 살던 시대와 내가 한 일에 대해 물어봐 주시오. 예를 들면 '왜 그런 선택을 했나요?'처럼 말이오." });
    talk(); return;
  }
  log.push({ who:"them", text:a });
  if (type === "kw" && a.length < 90) log.push({ who:"hint", text:"인물이 짧게 답했어요. 더 자세한 내용(특히 '왜?')은 교과서와 학습지에서 찾아 기사에 보태 보세요!" });
  asked.push({ q, type, own, a });
  if (asked.length === 3) log.push({ who:"hint", text:"인터뷰 끝! 이제 들은 내용을 '내 말로' 정리해서 기사를 써요. 인물의 말을 그대로 베끼면 등급이 낮아져요." });
  store.set(P.id+":asked", asked);
  talk();
}

/* ③ 기사 쓰기 = 학습지 Quest 2 정리 */
const FIELDS = [["name","기자 이름 (학번·이름)"],["title","📰 기사 제목"],["a1","1차 질문 · 답변 정리 (내 말로)"],["a2","2차 질문 · 답변 정리 (내 말로)"],["a3","3차 질문 · 답변 정리 (내 말로)"],["new","활동 소감 · 새롭게 알게 되었거나 흥미로운 내용"],["qa","궁금한 내용 Q&A"]];
function sheet(){
  window.scrollTo(0,0);
  const saved = store.get(P.id+":sheet") || {}; if (!saved.name) saved.name = store.get("name") || "";
  app.innerHTML = `
    <div class="panel">
      <div class="head"><div class="ava">${P.emoji}</div><div><b>${esc(P.name)} 인터뷰 기사</b><span>답변을 그대로 베끼지 말고, 내 말로 줄이고 이유를 붙여 정리해요.</span></div></div>
      ${FIELDS.map(([k,t]) => {
        const i = {a1:0,a2:1,a3:2}[k];
        const qBox = i !== undefined ? `<div class="fixed">${i+1}차 질문 : ${esc(asked[i].q)}</div><details><summary>인물의 답변 다시 보기</summary><p>${esc(asked[i].a)}</p></details>` : "";
        const ph = k==="title" ? "예: '칼 대신 말로 나라를 지킨 외교관' 서희를 만나다" : k==="qa" ? "Q. 더 알고 싶은 점  /  A. 찾아본 답" : k==="a3" ? "인물의 이야기가 오늘 우리에게 주는 의미도 함께 써 보세요." : "";
        return `<label>${t}</label>${qBox}${k==="name"||k==="title" ? `<input id="f_${k}" value="${esc(saved[k]||"")}" placeholder="${esc(k==="name"?"예: 20301 홍길동":ph)}">` : `<textarea id="f_${k}" rows="${k==="new"||k==="qa"?2:3}" placeholder="${esc(ph)}">${esc(saved[k]||"")}</textarea>`}`;
      }).join("")}
      <div id="live" style="margin-top:16px"></div>
      <div class="row"><button class="btn ghost" onclick="talk()">← 인터뷰 보기</button><button class="btn" onclick="finish()">🏅 등급 받고 기사 카드 만들기 →</button></div>
    </div>`;
  FIELDS.forEach(([k]) => document.getElementById("f_"+k).addEventListener("input", saveSheet));
  saveSheet();
}
function readSheet(){ const o={}; FIELDS.forEach(([k])=>{ const el=document.getElementById("f_"+k); if(el) o[k]=el.value; }); return o; }
function saveSheet(){
  const o = readSheet(); store.set(P.id+":sheet", o); if (o.name) store.set("name", o.name);
  const r = grade(o); document.getElementById("live").innerHTML = `<b>지금 등급 미리보기 :</b> ${r.badge} <span style="color:#888">(${r.score}/${r.max}점)</span>`;
}

/* ── 등급 : 역사왕 · 역사귀족 · 역사노비 ── */
const CAUSE = ["왜냐하면","때문","그래서","따라서","그러므로","결과","덕분","탓","이유","므로","니까"];
const NOW = ["오늘","지금","현재","우리","요즘","나에게","나도","사회"];
const DEEP = ["왜","어떻게","만약","이유","까닭","어째서","무엇 때문"];
const count = (t, ws) => ws.reduce((n,w)=>n+(String(t).split(w).length-1),0);
function bigrams(t){ const s = String(t).replace(/[\s.,!?'"~…·()]/g,""); const out = new Set(); for (let i=0;i<s.length-1;i++) out.add(s.slice(i,i+2)); return out; }
function copyRate(mine, src){ const a = bigrams(mine), b = bigrams(src); if (!a.size) return 1; let hit = 0; a.forEach(x => { if (b.has(x)) hit++; }); return hit / a.size; }
function grade(o){
  const ans = ["a1","a2","a3"].map(k => (o[k]||"").trim());
  const all = ans.join(" ") + " " + (o.new||"");
  const deepQ = asked.filter(a => DEEP.some(w => a.q.includes(w))).length;
  const specQ = asked.filter(a => P.keywords.some(k => a.q.replace(/\s/g,"").includes(k.replace(/\s/g,"")))).length;
  const rates = ans.map((t,i) => t.length >= 15 ? copyRate(t, asked[i].a) : 1);
  const avgRate = rates.reduce((s,x)=>s+x,0) / 3;
  const kw = P.keywords.filter(k => all.replace(/\s/g,"").includes(k.replace(/\s/g,"")));
  const years = (all.match(/\d{3,4}\s*년/g) || []).length;
  const items = [
    ["❓ '왜·어떻게' 같은 깊이 있는 질문을 했어요", deepQ >= 2 ? 2 : deepQ, 2, "'왜 그런 선택을 했나요?', '어떻게 ~했나요?'처럼 깊이 있는 질문을 해 보세요."],
    ["🎯 인물·사건 이름을 넣어 구체적으로 물었어요", specQ >= 2 ? 1 : 0, 1, "'서희는 왜 강동 6주를 요구했나요?'처럼 인물이나 사건 이름을 넣어 물어보세요."],
    ["🖊️ 답변을 베끼지 않고 내 말로 정리했어요", ans.every(t => t.length >= 25) ? (avgRate < 0.45 ? 2 : avgRate < 0.65 ? 1 : 0) : 0, 2, "인물의 말을 그대로 옮기지 말고, 핵심만 골라 내 말로 줄여 써 보세요."],
    ["📌 역사적 근거(키워드·연도)를 썼어요", Math.min(2, (kw.length >= 4 ? 2 : kw.length >= 2 ? 1 : 0) + (years ? 1 : 0)), 2, "인물과 관련된 키워드나 연도를 넣어 보세요."],
    ["🔗 이유와 결과를 이어서 설명했어요", count(all, CAUSE) >= 2 ? 1 : 0, 1, "'~때문에', '그래서 ~'로 인물의 선택과 결과를 이어 보세요."],
    ["🧭 오늘의 우리와 연결했어요", count(ans[2] + " " + (o.new||""), NOW) >= 1 && ans[2].length >= 20 ? 1 : 0, 1, "3차 답변이나 소감에 오늘 우리에게 주는 의미를 써 보세요."],
    ["📰 기사 제목을 지었어요", (o.title||"").trim().length >= 6 ? 1 : 0, 1, "인물을 한마디로 보여 주는 기사 제목을 지어 보세요."]
  ];
  const score = items.reduce((n,x)=>n+x[1],0), max = items.reduce((n,x)=>n+x[2],0);
  const tier = score >= 8 ? 1 : score >= 5 ? 2 : 3;
  const badge = tier === 1 ? "👑 1등급 · 역사왕" : tier === 2 ? "🎩 2등급 · 역사귀족" : "🧺 3등급 · 역사노비";
  return { score, max, tier, badge, items, kw };
}

/* ④ 등급 + 기사 카드 */
function finish(){
  const o = readSheet();
  if (!["a1","a2","a3"].every(k => (o[k]||"").trim().length >= 5)) { toast("1·2·3차 답변 정리를 조금 더 채워 주세요!"); return; }
  const r = grade(o); store.set(P.id+":done", r.badge.split(" · ")[1]);
  const tc = ["","#c99700","#7b4fd6","#8d6e63"][r.tier];
  const tips = r.items.filter(x => x[1] < x[2]).map(x => x[3]);
  window.scrollTo(0,0);
  app.innerHTML = `
    <div class="panel" style="text-align:center;border-color:${tc}">
      <div style="font-size:3rem">${r.badge.split(" ")[0]}</div>
      <div style="font-size:1.6rem;font-weight:900;color:${tc}">${r.badge.split(" ").slice(1).join(" ")}</div>
      <div style="color:#777;margin-top:4px">점수 ${r.score} / ${r.max}점 · 8점 이상 역사왕, 5~7점 역사귀족, 4점 이하 역사노비</div>
      <div style="text-align:left;margin-top:14px">${r.items.map(x=>`<div style="padding:5px 0;border-bottom:1px dashed #eee">${x[1]>=x[2]?"✅":x[1]>0?"🔸":"⬜"} ${x[0]} <span style="float:right;color:#888">${x[1]}/${x[2]}</span></div>`).join("")}</div>
      ${tips.length ? `<div style="text-align:left;background:#fff8e1;border-radius:12px;padding:10px 12px;margin-top:12px"><b>⬆️ 등급을 올리려면</b><br>${tips.map(t=>"· "+esc(t)).join("<br>")}</div>` : `<p style="font-weight:800;color:${tc}">완벽해요! 진정한 역사왕 👑</p>`}
      ${r.tier > 1 ? `<div class="row" style="justify-content:center"><button class="btn ghost" onclick="sheet()">✏️ 고쳐서 등급 올리기</button><button class="btn ghost" onclick="open_('${P.id}')">🎤 다시 인터뷰하기</button></div>` : ""}
    </div>
    <div id="card">
      <div style="font-size:.8rem;font-weight:900;letter-spacing:.15em;color:#999">역사 신문 · 특별 인터뷰</div>
      <h3>📰 ${esc(o.title || P.name + " 인터뷰")}</h3>
      <div class="meta">${P.emoji} ${esc(P.name)} (${esc(P.years)}) · ${esc(P.no)} ${esc(P.lecture)} · 기자 ${esc(o.name||"이름 없음")} · ${new Date().toLocaleDateString("ko-KR")}</div>
      <div style="display:inline-block;background:${tc};color:#fff;border-radius:20px;padding:4px 12px;font-weight:900">${r.badge} (${r.score}/${r.max})</div>
      <dl>
        ${asked.map((a,i)=>`<dt>Q${i+1}. ${esc(a.q)}</dt><dd>${esc(o["a"+(i+1)])}</dd>`).join("")}
        ${o.new?`<dt>💡 새롭게 알게 된 점</dt><dd>${esc(o.new)}</dd>`:""}
        ${o.qa?`<dt>❓ 궁금한 내용 Q&A</dt><dd>${esc(o.qa)}</dd>`:""}
        <dt>🔑 사용한 키워드</dt><dd>${r.kw.length ? r.kw.map(esc).join(", ") : "—"}</dd>
      </dl>
      <p style="margin:12px 0 0;font-size:.78rem;color:#999">역사는 삶이다! · 춘쌤의 한국사 · 역사 인물 가상 인터뷰</p>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn" onclick="saveImg()">🖼️ 기사 카드 이미지로 저장</button>
      <button class="btn ghost" onclick="home()">🏠 다른 인물</button>
    </div>
    <p class="note">저장한 이미지(또는 화면 캡처)를 패들렛에 올리면 끝! 등급은 질문의 깊이, 내 말로 정리했는지, 근거와 현재 연결을 보고 자동으로 매겨져요.</p>`;
}
function saveImg(){
  const el = document.getElementById("card");
  if (!window.html2canvas) { toast("이미지 저장이 안 되면 화면을 캡처해서 올려 주세요."); return; }
  html2canvas(el, { scale: 2, backgroundColor: "#ffffff" }).then(cv => {
    const a = document.createElement("a"); a.download = `인물인터뷰_${P.name}.png`; a.href = cv.toDataURL("image/png"); a.click();
  }).catch(() => toast("이미지 저장이 안 되면 화면을 캡처해서 올려 주세요."));
}

const start = location.hash.slice(1);
if (start && PEOPLE.some(p=>p.id===start)) { book = PEOPLE.find(p=>p.id===start).book; open_(start); } else home();
</script>
